<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#131a26"/>
      <stop offset="1" stop-color="#3d4a5c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="750" cy="440" rx="810" ry="540" fill="#cbd8e4" opacity="0.42"/>
    <ellipse cx="330" cy="840" rx="660" ry="440" fill="#0b0f16" opacity="0.6"/>
    <ellipse cx="1260" cy="260" rx="450" ry="300" fill="#e0a878" opacity="0.26"/>
  </g>
  <rect width="1500" height="1000" filter="url(#grain)" opacity="0.14"/>
  <rect width="1500" height="1000" fill="url(#base)" opacity="0.12"/>
</svg>
