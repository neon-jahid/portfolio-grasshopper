<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2231"/>
      <stop offset="1" stop-color="#1d4a56"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="132"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="360" cy="330" rx="552" ry="690" fill="#6fd7d0" opacity="0.55"/>
    <ellipse cx="864" cy="1170" rx="696" ry="869.9999999999999" fill="#0b1a26" opacity="0.7"/>
    <ellipse cx="216" cy="990" rx="408.00000000000006" ry="510.00000000000006" fill="#a8e6df" opacity="0.28"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.14"/>
  <rect width="1200" height="1500" fill="url(#base)" opacity="0.12"/>
</svg>
