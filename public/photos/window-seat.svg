<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#4a3524"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="132"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="864" cy="312" rx="480" ry="480" fill="#f5c98a" opacity="0.55"/>
    <ellipse cx="288" cy="888" rx="576" ry="576" fill="#120e0b" opacity="0.68"/>
    <ellipse cx="528" cy="600" rx="360" ry="360" fill="#d98f52" opacity="0.3"/>
  </g>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.14"/>
  <rect width="1200" height="1200" fill="url(#base)" opacity="0.12"/>
</svg>
