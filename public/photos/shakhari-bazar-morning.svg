<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1408"/>
      <stop offset="1" stop-color="#7a3d16"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="1020.0000000000001" cy="300" rx="660" ry="440" fill="#f0a86c" opacity="0.6"/>
    <ellipse cx="300" cy="720" rx="750" ry="500" fill="#3a1a09" opacity="0.65"/>
    <ellipse cx="1230" cy="620" rx="390" ry="260" fill="#ffd9a8" opacity="0.3"/>
  </g>
  <rect width="1500" height="1000" filter="url(#grain)" opacity="0.14"/>
  <rect width="1500" height="1000" fill="url(#base)" opacity="0.12"/>
</svg>
