<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1614"/>
      <stop offset="1" stop-color="#1d3a35"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="132"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="1200" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="792" cy="744" rx="456" ry="456" fill="#34d3bb" opacity="0.45"/>
    <ellipse cx="312" cy="312" rx="528" ry="528" fill="#070f0e" opacity="0.65"/>
    <ellipse cx="960" cy="240" rx="312" ry="312" fill="#b9a7f0" opacity="0.24"/>
  </g>
  <rect width="1200" height="1200" filter="url(#grain)" opacity="0.14"/>
  <rect width="1200" height="1200" fill="url(#base)" opacity="0.12"/>
</svg>
