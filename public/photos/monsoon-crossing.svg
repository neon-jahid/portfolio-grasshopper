    <ellipse cx="408.00000000000006" cy="390" rx="528" ry="660" fill="#7f8fd8" opacity="0.5"/>
    <ellipse cx="840" cy="1200" rx="672.0000000000001" ry="840.0000000000001" fill="#0a0c14" opacity="0.7"/>
    <ellipse cx="744" cy="869.9999999999999" rx="264" ry="330" fill="#f2b45c" opacity="0.32"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.14"/>
  <rect width="1200" height="1500" fill="url(#base)" opacity="0.12"/>
