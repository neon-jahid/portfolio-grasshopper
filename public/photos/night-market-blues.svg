<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1000" viewBox="0 0 1500 1000">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#16304f"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="110"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1500" height="1000" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="450" cy="620" rx="600" ry="400" fill="#3fb4d8" opacity="0.55"/>
    <ellipse cx="1110" cy="340" rx="390" ry="260" fill="#f06a4a" opacity="0.35"/>
    <ellipse cx="780" cy="880" rx="690" ry="460" fill="#060a14" opacity="0.6"/>
  </g>
  <rect width="1500" height="1000" filter="url(#grain)" opacity="0.14"/>
  <rect width="1500" height="1000" fill="url(#base)" opacity="0.12"/>
</svg>
