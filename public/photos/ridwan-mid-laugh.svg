<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1018"/>
      <stop offset="1" stop-color="#54263c"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="132"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>
  <rect width="1200" height="1500" fill="url(#base)"/>
  <g filter="url(#soft)">
    <ellipse cx="456" cy="450" rx="480" ry="600" fill="#e8749c" opacity="0.42"/>
    <ellipse cx="888" cy="1170" rx="624" ry="780" fill="#100a0e" opacity="0.7"/>
    <ellipse cx="720" cy="780" rx="336.00000000000006" ry="420.00000000000006" fill="#f6c9a0" opacity="0.3"/>
  </g>
  <rect width="1200" height="1500" filter="url(#grain)" opacity="0.14"/>
  <rect width="1200" height="1500" fill="url(#base)" opacity="0.12"/>
</svg>
