<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>জাহিদ হাসান — এসকিউএ ইঞ্জিনিয়ার</title>
    <meta
      name="description"
      content="জাহিদ হাসানের পোর্টফোলিও — সফটওয়্যার কোয়ালিটি অ্যাসিওরেন্স ইঞ্জিনিয়ার। ম্যানুয়াল ও অটোমেশন টেস্টিং, API টেস্টিং, পারফরম্যান্স টেস্টিং, আর কোয়ালিটি ইঞ্জিনিয়ারিং নিয়ে লেখালেখি।"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bn_BD" />
    <meta property="og:title" content="জাহিদ হাসান — এসকিউএ ইঞ্জিনিয়ার" />
    <meta
      property="og:description"
      content="সফটওয়্যার কোয়ালিটি অ্যাসিওরেন্স ইঞ্জিনিয়ার। ম্যানুয়াল ও অটোমেশন টেস্টিং, API ও পারফরম্যান্স টেস্টিং।"
    />

    <!-- Set the theme before first paint so there is no light/dark flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — fall back to the CSS default */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Hind Siliguri covers Bengali; Poppins and Space Mono do not. Google
      Fonts splits its stylesheet by unicode-range, so the Bengali files are
      only downloaded once a Bengali glyph is actually on the page — an
      English-only visit costs nothing extra.

      Only the weights the site actually uses are requested: 400 for body,
      500 for `font-medium`, 600 for headings and 700 for the bold runs in
      blog posts. Every extra weight is another file, and the Bengali ones are
      the largest on the page — so do not add one here without a use for it.

      The site is in Bangla, so <html lang="bn"> is set above and the script
      rules in src/index.css handle tracking and leading. Switching back to
      English means changing it to lang="en" and profile.locale in
      src/data/site.js to 'en-GB'.
    -->
    <!--
      Loaded as a preload that promotes itself to a stylesheet once it lands,
      rather than as a plain <link rel="stylesheet">.

      A stylesheet in <head> blocks first paint until it arrives — and this
      one is a round trip to another origin. That put fonts.googleapis.com in
      front of the preloader below, which is precisely the wait the preloader
      exists to cover: the screen stayed blank until the font CSS answered,
      and only then did the loading screen appear. This way the page paints on
      its own stylesheet and the fonts swap in behind the overlay.

      The <noscript> copy keeps the fonts for anyone without JS, who never
      sees the preloader either.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="preload"
      as="style"
      onload="this.rel='stylesheet'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
    </noscript>

    <!--
      Entry preloader.
      ================
      Markup and styles are inline, on purpose. Everything else on this page
      is a React component, but a loading screen that lives in the bundle can
      only appear *after* the bundle has downloaded — which is the exact gap
      it exists to cover. This paints on the first parse of the HTML, before
      a single byte of JS or CSS is fetched.

      Which is also why the colours are literals rather than the tokens in
      src/index.css: that stylesheet is not loaded yet. They are copies of
      --color-canvas / --color-line / --color-accent, light and dark. The
      theme script above has already put `.dark` on <html>, so the overlay
      comes up in the right theme with no flash.

      The mark is the favicon, drawn on stroke by stroke.

      src/lib/preloader.js takes it down once the fonts and the first screen
      of images are ready. The `pl-bail` animation is the safety net: if that
      script never runs — a chunk fails, JS is off — the overlay clears itself
      after eight seconds rather than sitting on top of the site forever.
    -->
    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #fbf9f6;
        animation: pl-bail 0.01s linear 8s forwards;
      }

      .dark #preloader {
        background: #100e11;
      }

      #preloader .pl-inner {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.75rem;
      }

      #preloader .pl-mark {
        position: relative;
        width: 4.25rem;
        height: 4.25rem;
      }

      #preloader .pl-glow {
        position: absolute;
        inset: -45%;
        border-radius: 50%;
        background: #0f8f80;
        opacity: 0.2;
        filter: blur(30px);
        animation: pl-breathe 2.4s ease-in-out infinite;
      }

      .dark #preloader .pl-glow {
        background: #34d3bb;
      }

      #preloader svg {
        position: relative;
        display: block;
        width: 100%;
        height: 100%;
        border-radius: 0.9rem;
        box-shadow: 0 18px 40px -22px rgba(0, 0, 0, 0.55);
      }

      /* Each stroke draws itself on, holds, then wipes off the far end. */
      #preloader .pl-stroke {
        stroke-dasharray: var(--len);
        stroke-dashoffset: var(--len);
        animation: pl-draw 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      #preloader .pl-stroke:nth-of-type(2) {
        animation-delay: 0.12s;
      }

      #preloader .pl-stroke:nth-of-type(3) {
        animation-delay: 0.24s;
      }

      #preloader .pl-bar {
        position: relative;
        overflow: hidden;
        width: 8rem;
        height: 2px;
        border-radius: 999px;
        background: #e8e2d9;
      }

      .dark #preloader .pl-bar {
        background: #2a2731;
      }

      #preloader .pl-bar > i {
        position: absolute;
        inset: 0 auto 0 0;
        width: 0;
        border-radius: inherit;
        background: #0f8f80;
        animation: pl-fill 2.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      .dark #preloader .pl-bar > i {
        background: #34d3bb;
      }

      /* Set by src/lib/preloader.js: run the bar out to full, then fade. */
      #preloader.is-done {
        opacity: 0;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1) 0.18s;
        pointer-events: none;
      }

      #preloader.is-done .pl-bar > i {
        animation: pl-finish 0.3s ease-out forwards;
      }

      @keyframes pl-draw {
        0% { stroke-dashoffset: var(--len); }
        45% { stroke-dashoffset: 0; }
        68% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: calc(var(--len) * -1); }
      }

      @keyframes pl-fill {
        0% { width: 0; }
        55% { width: 60%; }
        100% { width: 88%; }
      }

      @keyframes pl-finish {
        to { width: 100%; }
      }

      @keyframes pl-breathe {
        0%, 100% { opacity: 0.14; transform: scale(0.92); }
        50% { opacity: 0.28; transform: scale(1.08); }
      }

      @keyframes pl-bail {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }

      /* Same screen, no movement: the mark sits drawn and the bar sits full. */
      @media (prefers-reduced-motion: reduce) {
        #preloader .pl-glow,
        #preloader .pl-stroke,
        #preloader .pl-bar > i {
          animation: none !important;
        }

        #preloader .pl-stroke {
          stroke-dashoffset: 0;
        }

        #preloader .pl-bar > i {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="preloader" role="status" aria-label="লোড হচ্ছে">
      <div class="pl-inner">
        <div class="pl-mark">
          <span class="pl-glow"></span>
          <svg viewBox="0 0 64 64" aria-hidden="true">
            <rect width="64" height="64" rx="14" fill="#0b0f14" />
            <g
              fill="none"
              stroke="#2dd4bf"
              stroke-width="5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path class="pl-stroke" style="--len: 20" d="M18 26l-8 6 8 6" />
              <path class="pl-stroke" style="--len: 20" d="M46 26l8 6-8 6" />
              <path class="pl-stroke" style="--len: 31" d="M38 18L26 46" />
            </g>
          </svg>
        </div>

        <div class="pl-bar"><i></i></div>
      </div>
    </div>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
