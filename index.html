<!doctype html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>জাহিদ হাসান — এসকিউএ ইঞ্জিনিয়ার</title>
    <meta
      name="description"
      content="জাহিদ হাসানের পোর্টফোলিও — সফটওয়্যার কোয়ালিটি অ্যাসিওরেন্স ইঞ্জিনিয়ার। ম্যানুয়াল ও অটোমেশন টেস্টিং, API টেস্টিং, পারফরম্যান্স টেস্টিং, আর কোয়ালিটি ইঞ্জিনিয়ারিং নিয়ে লেখালেখি।"
    />

    <!-- Open Graph / social preview -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="bn_BD" />
    <meta property="og:title" content="জাহিদ হাসান — এসকিউএ ইঞ্জিনিয়ার" />
    <meta
      property="og:description"
      content="সফটওয়্যার কোয়ালিটি অ্যাসিওরেন্স ইঞ্জিনিয়ার। ম্যানুয়াল ও অটোমেশন টেস্টিং, API ও পারফরম্যান্স টেস্টিং।"
    />

    <!-- Set the theme before first paint so there is no light/dark flash -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = stored || (prefersDark ? 'dark' : 'light');
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
        } catch (e) {
          /* localStorage unavailable — fall back to the CSS default */
        }
      })();
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Hind Siliguri covers Bengali; Poppins and Space Mono do not. Google
      Fonts splits its stylesheet by unicode-range, so the Bengali files are
      only downloaded once a Bengali glyph is actually on the page — an
      English-only visit costs nothing extra.

      Only the weights the site actually uses are requested: 400 for body,
      500 for `font-medium`, 600 for headings and 700 for the bold runs in
      blog posts. Every extra weight is another file, and the Bengali ones are
      the largest on the page — so do not add one here without a use for it.

      The site is in Bangla, so <html lang="bn"> is set above and the script
      rules in src/index.css handle tracking and leading. Switching back to
      English means changing it to lang="en" and profile.locale in
      src/data/site.js to 'en-GB'.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Space+Mono:wght@400&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
